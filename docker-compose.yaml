services:
  telegram-proxy:
    build: .
    container_name: telegram-proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
